<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" role="img" aria-labelledby="title desc">
<title id="title">Drone video to coordinator-reviewed evidence</title><desc id="desc">The private receiver supports recording and saved-frame evidence. Validated external detector output links to selected-animal assessment and rule-based triage. The coordinator can review the received footage and findings. Hardware validation, live YOLO execution, automatic shortlisting and patrol alert creation remain pending.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#63DECD"/></marker></defs>
<rect width="1200" height="988" rx="24" fill="#0B1728"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="47" font-size="15" fill="#63DECD" font-weight="700">LIFEJACKET / DRONE EVIDENCE</text><text x="42" y="95" font-size="34" fill="#F2F7FA" font-weight="700">Keep the footage. Analyze selected evidence.</text><text x="42" y="132" font-size="20" fill="#B2C9D8" font-weight="400">Current existing-case review path; physical aircraft connectivity still needs acceptance.</text><rect x="42" y="174" width="492" height="150" rx="18" fill="#13283B" stroke="#F5C578" stroke-width="1.5" stroke-dasharray="7 5"/><text x="64" y="205" font-size="14" fill="#F5C578" font-weight="700">HARDWARE ACCEPTANCE PENDING</text><text x="64" y="239" font-size="25" fill="#F2F7FA" font-weight="650">Mini 2 + iPhone / DJI Fly</text><text x="64" y="275" font-size="19" fill="#B2C9D8" font-weight="400">Pilot publishes video to a private address</text><text x="64" y="304" font-size="19" fill="#B2C9D8" font-weight="400">Actual phone-to-server link: not yet tested</text><rect x="612" y="174" width="546" height="150" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="634" y="205" font-size="14" fill="#63DECD" font-weight="700">SOFTWARE REHEARSED</text><text x="634" y="239" font-size="25" fill="#F2F7FA" font-weight="650">Private stream receiver</text><text x="634" y="275" font-size="19" fill="#B2C9D8" font-weight="400">Receives the feed and shows a sampled preview</text><text x="634" y="304" font-size="19" fill="#B2C9D8" font-weight="400">No flight-control commands</text><path d="M534 250 H606" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 324 V355 H286 V382" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M960 324 V382" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="389" width="492" height="158" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="64" y="420" font-size="14" fill="#63DECD" font-weight="700">PRESERVE CONTEXT</text><text x="64" y="454" font-size="25" fill="#F2F7FA" font-weight="650">Received-video archive</text><text x="64" y="490" font-size="19" fill="#B2C9D8" font-weight="400">Private playable segments + provenance</text><text x="64" y="519" font-size="19" fill="#B2C9D8" font-weight="400">Original aircraft recording stays separate</text><rect x="612" y="389" width="546" height="158" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="634" y="420" font-size="14" fill="#63DECD" font-weight="700">CONNECTED HANDOFF</text><text x="634" y="454" font-size="25" fill="#F2F7FA" font-weight="650">Saved frame + detector results</text><text x="634" y="490" font-size="19" fill="#B2C9D8" font-weight="400">Select an original frame; import matched results</text><text x="634" y="519" font-size="19" fill="#B2C9D8" font-weight="400">Select the intended animal for assessment</text><path d="M886 547 V580" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="612" y="587" width="546" height="144" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="634" y="625" font-size="25" fill="#F2F7FA" font-weight="650">Gemini assessment + triage rules</text><text x="634" y="662" font-size="19" fill="#B2C9D8" font-weight="400">Selected still / animal crop only</text><text x="634" y="691" font-size="19" fill="#B2C9D8" font-weight="400">Advisory findings; no whole-video model input</text><path d="M286 547 V781 H600 V809" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M886 731 V781 H600 V809" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="255" y="815" width="690" height="91" rx="18" fill="#153B3D" stroke="#63DECD"/><text x="280" y="853" font-size="25" fill="#F2F7FA" font-weight="650">Coordinator reviews the same case</text><text x="280" y="884" font-size="18" fill="#B2C9D8" font-weight="400">Original footage + saved photo + advisory finding + human outcome</text><text x="42" y="950" font-size="18" fill="#F5C578" font-weight="400">PENDING: trained/live YOLO execution, automatic frame shortlisting, patrol alerts and physical-link validation.</text></g></svg>
