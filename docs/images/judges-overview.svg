<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="544" viewBox="0 0 1200 544" role="img" aria-labelledby="title desc">
<title id="title">LifeJacket: report, review, observe</title><desc id="desc">Public reports become structured cases for coordinator review. Optional observation adds evidence back to the same case. Human approval remains central.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087F8C"/></marker></defs>
<rect width="1200" height="544" rx="24" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="47" font-size="15" fill="#087F8C" font-weight="700">LIFEJACKET / THE BIG PICTURE</text><text x="42" y="95" font-size="33" fill="#202832" font-weight="700">Clearer evidence. A shared case. A human decision.</text><text x="42" y="132" font-size="20" fill="#586879" font-weight="400">A rescue coordination prototype, from the first report to follow-up review.</text><rect x="42" y="173" width="340" height="191" rx="18" fill="#F1F8F7" stroke="#D5DFE5" stroke-width="1.5"/><text x="64" y="204" font-size="14" fill="#087F8C" font-weight="700">01 / PUBLIC REPORT</text><text x="64" y="238" font-size="25" fill="#202832" font-weight="650">Report what you see</text><text x="64" y="274" font-size="19" fill="#586879" font-weight="400">Photo + location</text><text x="64" y="303" font-size="19" fill="#586879" font-weight="400">Choose the intended animal</text><text x="64" y="332" font-size="19" fill="#586879" font-weight="400">Answer guided questions</text><rect x="430" y="173" width="340" height="191" rx="18" fill="#F1F8F7" stroke="#D5DFE5" stroke-width="1.5"/><text x="452" y="204" font-size="14" fill="#087F8C" font-weight="700">02 / COORDINATOR</text><text x="452" y="238" font-size="25" fill="#202832" font-weight="650">Review the case</text><text x="452" y="274" font-size="19" fill="#586879" font-weight="400">Structured findings</text><text x="452" y="303" font-size="19" fill="#586879" font-weight="400">Rule-based urgency reasons</text><text x="452" y="332" font-size="19" fill="#586879" font-weight="400">Responder candidates</text><rect x="818" y="173" width="340" height="191" rx="18" fill="#F1F8F7" stroke="#D5DFE5" stroke-width="1.5"/><text x="840" y="204" font-size="14" fill="#087F8C" font-weight="700">03 / OBSERVATION</text><text x="840" y="238" font-size="25" fill="#202832" font-weight="650">Add another view</text><text x="840" y="274" font-size="19" fill="#586879" font-weight="400">Approved observation request</text><text x="840" y="303" font-size="19" fill="#586879" font-weight="400">Video + saved original frames</text><text x="840" y="332" font-size="19" fill="#586879" font-weight="400">Compare and review findings</text><g transform="translate(337 190)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="0" width="20" height="30" rx="4"/><path d="M10 25h6"/></g><g transform="translate(725 190)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 0 27 5v10c0 8-7 13-13 17C8 28 1 23 1 15V5Z"/><path d="m7 15 5 5 10-11"/></g><g transform="translate(1104 190)" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="7" width="31" height="22" rx="5"/><path d="m7 7 3-6h11l3 6"/><circle cx="16" cy="18" r="6"/></g><path d="M382 268 H424" fill="none" stroke="#087F8C" stroke-dasharray="5 7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M770 268 H812" fill="none" stroke="#087F8C" stroke-dasharray="5 7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M988 364 V414 H600 V370" fill="none" stroke="#087F8C" stroke-dasharray="5 7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="711" y="405" font-size="17" fill="#586879" font-weight="400">New evidence returns to the same case</text><rect x="42" y="449" width="1116" height="64" rx="14" fill="#E6F5EF"/><text x="68" y="488" font-size="17" fill="#087F8C" font-weight="700">HUMAN REVIEW</text><text x="260" y="488" font-size="19" fill="#202832" font-weight="400">The coordinator records the next step. Nothing dispatches a rescue automatically.</text></g></svg>
