<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">AI pipeline, coordination agent, rules and coordinator</title><desc id="desc">The code-orchestrated model pipeline is distinct from the bounded read-only tool-using coordination agent. Deterministic services support a human coordinator. This diagram is a responsibility map, not a claim that each component is an autonomous agent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#63DECD"/></marker></defs>
<rect width="1200" height="790" rx="24" fill="#0B1728"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="47" font-size="15" fill="#63DECD" font-weight="700">LIFEJACKET / AI, TOOLS AND HUMAN CONTROL</text><text x="42" y="95" font-size="33" fill="#F2F7FA" font-weight="700">Different responsibilities. One reviewable workflow.</text><text x="42" y="132" font-size="20" fill="#B2C9D8" font-weight="400">Model components interpret evidence; rules and people control consequential steps.</text><rect x="42" y="174" width="672" height="348" rx="18" fill="#102235" stroke="#35546B"/><text x="65" y="211" font-size="15" fill="#63DECD" font-weight="700">ORCHESTRATED MODEL COMPONENTS</text><rect x="64" y="232" width="198" height="106" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="86" y="270" font-size="25" fill="#F2F7FA" font-weight="650">Detect</text><text x="86" y="307" font-size="19" fill="#B2C9D8" font-weight="400">Locate candidates</text><rect x="279" y="232" width="198" height="106" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="301" y="270" font-size="25" fill="#F2F7FA" font-weight="650">Identify</text><text x="301" y="307" font-size="19" fill="#B2C9D8" font-weight="400">Resolve identity</text><rect x="494" y="232" width="198" height="106" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="516" y="270" font-size="25" fill="#F2F7FA" font-weight="650">Assess</text><text x="516" y="307" font-size="19" fill="#B2C9D8" font-weight="400">Describe condition</text><text x="65" y="378" font-size="22" fill="#F2F7FA" font-weight="650">Cross-check → write report → guardrail check</text><text x="65" y="417" font-size="19" fill="#B2C9D8" font-weight="400">Code manages the stages, question budgets and fallbacks.</text><text x="65" y="446" font-size="19" fill="#B2C9D8" font-weight="400">These boxes are specialized tasks, not independent planners.</text><rect x="752" y="174" width="406" height="170" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="774" y="205" font-size="14" fill="#63DECD" font-weight="700">TOOL-USING AGENT</text><text x="774" y="239" font-size="25" fill="#F2F7FA" font-weight="650">Coordination agent</text><text x="774" y="275" font-size="19" fill="#B2C9D8" font-weight="400">Chooses scoped, read-only tools</text><text x="774" y="304" font-size="19" fill="#B2C9D8" font-weight="400">Inspects results in a bounded loop</text><rect x="752" y="379" width="406" height="143" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="774" y="417" font-size="25" fill="#F2F7FA" font-weight="650">Read-only case tools</text><text x="774" y="454" font-size="19" fill="#B2C9D8" font-weight="400">History · assignments · pending tasks</text><text x="774" y="483" font-size="19" fill="#B2C9D8" font-weight="400">Available responders</text><path d="M955 344 V373" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1158 449 H1177 V257 H1164" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M378 522 V558" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M955 522 V558" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="564" width="672" height="146" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="64" y="602" font-size="25" fill="#F2F7FA" font-weight="650">Deterministic rules + services</text><text x="64" y="639" font-size="19" fill="#B2C9D8" font-weight="400">Urgency · responder ranking · duplicate checks</text><text x="64" y="668" font-size="19" fill="#B2C9D8" font-weight="400">Permissions · saved evidence · workflow state</text><rect x="752" y="564" width="406" height="146" rx="18" fill="#13283B" stroke="#35546B" stroke-width="1.5"/><text x="774" y="602" font-size="25" fill="#F2F7FA" font-weight="650">Human coordinator</text><text x="774" y="639" font-size="19" fill="#B2C9D8" font-weight="400">Reviews evidence and uncertainty</text><text x="774" y="668" font-size="19" fill="#B2C9D8" font-weight="400">Approves the operational next step</text><path d="M714 635 H746" fill="none" stroke="#63DECD" stroke-width="2.5" marker-end="url(#arrow)"/><text x="42" y="752" font-size="18" fill="#B2C9D8" font-weight="400">Architecture overview: the coordination tools do not command the aircraft or dispatch a rescue.</text></g></svg>
