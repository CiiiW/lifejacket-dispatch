name: LifeJacketCamera
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.lifejacket.prototype.camera
    INFOPLIST_FILE: App/Info.plist
    CLANG_ENABLE_OBJC_ARC: "YES"
    TARGETED_DEVICE_FAMILY: 1
targets:
  LifeJacketCamera:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
